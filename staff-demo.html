<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex">
<title>採鮮員工手機樣品</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 固定淺色。模組配色：首頁深灰藍、點貨海藍、進貨琥珀橘（LINE 下單頁是鮮綠，彼此區隔） */
/* Layout: 手機 App — 頂部模組色標題列、內容、底部動作列 */
:root{
  --bg:#f3f5f7; --card:#ffffff; --fg:#1e2933; --muted:#677482; --line:#e0e5ea;
  --head:#33424f; --head-fg:#ffffff; --accent:#33424f; --accent-soft:#e6ebf0; --on-accent:#ffffff;
  --bad:#c7332b; --bad-soft:#fde8e6; --ok:#257a45; --ok-soft:#e2f3e8; --warn:#b5620f; --warn-soft:#fdf0e0;
  --info:#2c5e89; --info-soft:#e3edf7;
  --c-根莖:#f5e6d2; --c-葉菜:#e0f1d9; --c-水菜:#d9eff1; --c-瓜果:#edf2d3; --c-其他:#ebe8f5; --c-菇類:#f0e4d9; --c-辛香:#fae1e0; --c-冷凍:#dde9f8;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
:root[data-mod="count"]{--head:#1d6fb8; --accent:#155a96; --accent-soft:#e3eefa}
:root[data-mod="buy"]{--head:#d6701a; --accent:#b2570c; --accent-soft:#fdeedd}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:640px;margin:0 auto;min-width:0;width:100%}
.catbar,.vtabs{min-width:0;max-width:100%}
.demo{background:#fff8d6;color:#6b5600;font-size:12.5px;padding-block:6px}
.demo .in{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.demo select{width:auto;font-size:12.5px;padding:2px 6px}
.demo button{border:1px solid #d9c46a;background:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--head);color:var(--head-fg)}
.top .bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:58px}
.top h1{margin:0;text-align:center;font-size:19px;font-weight:700}
.top h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.hb{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center}
main{padding-block:12px 150px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--card);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;font-weight:700;white-space:nowrap}
.p-new{background:var(--info-soft);color:var(--info)}
.p-buy{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
/* 首頁 */
.who{display:flex;align-items:center;gap:12px}
.who .av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:16px;padding:18px 16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:140px}
.tile b{font-size:24px}
.tile span{font-size:13px;opacity:.92}
.tile.count{background:#1d6fb8}
.tile.buy{background:#d6701a}
.tile.lock{background:#b9c1c9}
/* 點貨 */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 0;font-size:16px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.seg button small{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button[aria-pressed="true"] small{color:#dbe8f5}
.catbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cb{flex:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:var(--card)}
.cb[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.cat{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.cat h3{margin:0;padding:8px 14px;font-size:15px;display:flex;justify-content:space-between}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 14px;background:var(--card);border-top:1px solid var(--line)}
.ci .nm{font-size:17px;font-weight:700}
.ci .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;border-radius:999px;padding:0 7px;font-weight:700}
.t-must{background:var(--bad-soft);color:var(--bad)}
.t-freq{background:var(--info-soft);color:var(--info)}
.t-proc{background:var(--warn-soft);color:var(--warn)}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:84px;text-align:center;font-size:20px;font-weight:700;padding:6px 4px;font-variant-numeric:tabular-nums}
.qty input.zero{color:var(--bad);border-color:var(--bad)}
.qty input.miss{border-color:var(--bad);background:var(--bad-soft)}
.qty .u{font-size:14px;color:var(--muted);min-width:28px}
.zerotxt{grid-column:1/-1;color:var(--bad);font-weight:700;font-size:13px}
.ci.done{background:#fbfdff}
.ci.done .nm::after{content:" ✓";color:var(--ok)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bottom .in{display:flex;gap:10px;align-items:center}
.bottom .sum{flex:1;font-size:14px;color:var(--muted)}
.bottom .sum b{color:var(--fg);font-size:18px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:6px 4px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .r{text-align:right}
.diff-p{color:var(--ok);font-weight:700}
.diff-n{color:var(--bad);font-weight:700}
.tblwrap{overflow-x:auto}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* 進貨 */
.vtabs{display:flex;gap:6px;overflow-x:auto}
.vt{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:15px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.vt small{font-size:11.5px;color:var(--muted)}
.vt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.vt[aria-pressed="true"] small{color:#ffe6cc}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 14px;background:var(--card);border-top:1px solid var(--line)}
.bi:first-child{border-top:0}
.bi .nm{font-size:17px;font-weight:700}
.bi .nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;background:var(--bg);border-radius:8px;padding:6px 4px;font-size:12px;color:var(--muted)}
.bi .nums b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.bi .nums .sug b{color:var(--accent)}
.bi .sub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.bi.on{background:#fffaf3}
.linkb{border:0;background:transparent;color:var(--accent);font-weight:700;padding:2px 0;font-size:13.5px;text-decoration:underline}
.oc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.oc .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.oc .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc .t b{font-size:17px}
.steps{display:flex;gap:4px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.steps .on{color:var(--accent);font-weight:700}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;font-family:var(--f-body);font-size:14.5px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:20px}
.alert{border-radius:10px;padding:10px 12px;font-size:14px}
.a-bad{background:var(--bad-soft);color:var(--bad)}
.a-warn{background:var(--warn-soft);color:var(--warn)}
.a-ok{background:var(--ok-soft);color:var(--ok)}
.a-info{background:var(--info-soft);color:var(--info)}
.list{display:flex;flex-direction:column;gap:2px}
.list button{border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;text-align:left;font-size:16px;display:flex;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:#1e2933;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%}
</style>
</head>
<body>

<div class="demo gut"><div class="in">
  <b>樣品資料</b>
  <label>登入身分 <select id="user"><option value="順">順（點貨）</option><option value="巃騰">巃騰（點貨）</option><option value="小沾">小沾（點貨）</option><option value="永順" selected>永順（全部＋看成本，與土豆同權限）</option><option value="土豆">土豆（全部＋看成本）</option></select></label>
  <button type="button" id="fill">一鍵帶入點貨數字</button>
</div></div>

<header class="top"><div class="gut"><div class="in bar">
  <div id="hL"></div><h1 id="hT"></h1><div id="hR"></div>
</div></div></header>

<!-- 首頁 -->
<main class="gut" id="v-home"><div class="in" style="display:flex;flex-direction:column;gap:14px">
  <div class="card who"><div class="av" id="av"></div><div><b id="uName" style="font-size:18px"></b><div class="hint" id="uPerm"></div></div></div>
  <div class="tiles">
    <button class="tile count" type="button" data-go="count"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M9 4h6l1 2h3v14H5V6h3z"/><path d="M9 12l2 2 4-4"/></svg><b>點貨</b><span id="tCount"></span></button>
    <button class="tile buy" type="button" data-go="buy" id="tileBuy"><svg class="i" viewBox="0 0 24 24" style="width:30px;height:30px"><path d="M2.5 6h11v10h-11z"/><path d="M13.5 9.5h4l3 3.5v3h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><b>進貨</b><span id="tBuy"></span></button>
  </div>
  <div class="card"><b>今天</b><div id="todayInfo" class="hint" style="margin-top:4px"></div></div>
</div></main>

<!-- 點貨 -->
<main class="gut" id="v-count" hidden><div class="in" style="display:flex;flex-direction:column;gap:10px">
  <div class="seg" id="locSeg"></div>
  <div class="catbar" id="catBar"></div>
  <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="showAll" style="width:auto"> 顯示今天不用點的品項</label>
  <div id="cList" style="display:flex;flex-direction:column;gap:10px"></div>
  <div class="card"><b>備註與照片</b><p class="hint">清單外的品項、手寫紀錄可以拍照上傳</p>
    <textarea id="cNote" rows="2" placeholder="例：後門有 2 箱客人退回的小黃瓜" style="margin-top:6px"></textarea>
    <div class="photo" style="margin-top:8px"><label class="btn soft sm" style="cursor:pointer">📷 拍照／選照片<input type="file" accept="image/*" id="cPhoto" hidden multiple></label><span id="cPhotos" class="photo"></span></div>
  </div>
</div></main>

<!-- 點貨結果 -->
<main class="gut" id="v-countdone" hidden><div class="in" style="display:flex;flex-direction:column;gap:10px">
  <div class="alert a-ok" id="cdHead"></div>
  <div class="card"><b>差異比對</b><p class="hint">帳面＝上次點貨＋之後進貨－出貨－加工領料。差異只列出來，不會自動調整，下次以點貨數為準。</p>
    <div class="tblwrap"><table class="tbl" id="diffTbl"></table></div></div>
  <div class="card" id="cdZero"></div>
  <button class="btn pri" type="button" data-go="home">回首頁</button>
</div></main>

<!-- 進貨列表 -->
<main class="gut" id="v-buy" hidden><div class="in" style="display:flex;flex-direction:column;gap:10px">
  <div class="alert a-info" id="buyCountInfo"></div>
  <button class="btn pri" type="button" id="newPO">＋ 新增進貨單（依建議量）</button>
  <div id="poList" style="display:flex;flex-direction:column;gap:10px"></div>
</div></main>

<!-- 進貨單編輯 -->
<main class="gut" id="v-po" hidden><div class="in" style="display:flex;flex-direction:column;gap:10px">
  <div class="steps" id="poSteps"></div>
  <div class="vtabs" id="vTabs"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="hint" id="vHint"></span><button class="btn soft sm" type="button" id="useSug">全部帶入建議量</button></div>
  <div class="card" style="padding:0;overflow:hidden" id="poItems"></div>
  <button class="btn plain" type="button" id="addItem">＋ 臨時加品項</button>
</div></main>

<!-- 到貨核對 -->
<main class="gut" id="v-recv" hidden><div class="in" style="display:flex;flex-direction:column;gap:10px">
  <div class="steps" id="rSteps"></div>
  <div class="alert a-warn">卸貨時逐項核對<b>數量</b>和<b>金額</b>。實收比叫的少要選短收原因；單價先帶最近進價，跟廠商單據不同就改。</div>
  <div class="vtabs" id="rTabs"></div>
  <div class="card" style="padding:0;overflow:hidden" id="rItems"></div>
  <div class="card" id="rVendor"></div>
  <div class="card"><b>廠商單據照片</b><div class="photo" style="margin-top:8px"><label class="btn soft sm" style="cursor:pointer">📷 拍單據<input type="file" accept="image/*" id="rPhoto" hidden multiple></label><span id="rPhotos" class="photo"></span></div></div>
</div></main>

<div class="bottom gut" id="bottom" hidden><div class="in"><div class="sum" id="bSum"></div><div id="bBtns" style="display:flex;gap:8px"></div></div></div>

<div class="sheet" id="sh" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="shT"><h2 id="shT"></h2><div id="shB" style="display:flex;flex-direction:column;gap:12px"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 樣品資料 ---------- */

 {id:6,n:'空心菜',sp:'公斤',cat:'水菜',u:'公斤',v:'惠鮮',safe:12,book:{倉:5,市:1},freq:'d',price:35,locs:['倉','市']},
 {id:7,n:'地瓜葉',sp:'公斤',cat:'水菜',u:'公斤',v:'惠鮮',safe:8,book:{倉:3},freq:'d',price:28,locs:['倉']},
 {id:8,n:'洋蔥',sp:'20KG 袋',cat:'根莖',u:'袋',v:'西螺',safe:6,book:{倉:4,市:1},must:1,freq:'d',price:480,locs:['倉','市']},
 {id:9,n:'紅蘿蔔',sp:'箱',cat:'根莖',u:'箱',v:'西螺',safe:4,book:{倉:2,市:1},freq:'d',price:420,locs:['倉','市']},
 {id:10,n:'馬鈴薯',sp:'箱',cat:'根莖',u:'箱',v:'西螺',safe:3,book:{倉:2},freq:'alt',price:560,locs:['倉']},
 {id:11,n:'小黃瓜',sp:'箱',cat:'瓜果',u:'箱',v:'西螺',safe:3,book:{倉:1,市:1},freq:'d',price:650,locs:['倉','市']},
 {id:12,n:'牛番茄',sp:'箱',cat:'瓜果',u:'箱',v:'西螺',safe:2,book:{倉:1},freq:'alt',price:700,locs:['倉']},
 {id:13,n:'杏鮑菇',sp:'3KG 箱',cat:'菇類',u:'箱',v:'霧峰菇',safe:4,book:{倉:2},freq:'d',price:330,locs:['倉']},

const fullName=i=>i.n+(i.sp&&i.sp!==i.u?' '+i.sp:'');

/* ---------- 狀態 ---------- */

        ${has&&+v===0?'<div class="zerotxt">無庫存</div>':''}</div>`}).join('')}</section>`}).join('')||'<div class="card hint">這個分類今天沒有要點的品項</div>';

  if(raw===''){delete counts[loc][id]}else{const v=parseFloat(raw);if(isNaN(v)||v<0){toast('請填 0 或正數');e.target.value='';delete counts[loc][id]}else{const i=IT.find(x=>x.id===id);counts[loc][id]=i.u==='公斤'?fmt(v):Math.round(v);if(i.u!=='公斤'&&v!==Math.round(v))toast(i.u+'只能填整數，已調整')}}
  const y=window.scrollY;renderCount();window.scrollTo(0,y)});

$('cPhoto').addEventListener('change',e=>{[...e.target.files].forEach(f=>photosC.push(URL.createObjectURL(f)));$('cPhotos').innerHTML=photosC.map(u=>`<img src="${u}" alt="點貨照片">`).join('')});
$('bottom').addEventListener('click',e=>{
  if(e.target.closest('#cSubmit'))submitCount();
  if(e.target.closest('#poSave'))savePO('new');if(e.target.closest('#poSend'))sendPO();
  if(e.target.closest('#rDone'))finishRecv();if(e.target.closest('#poSign'))signPO()});
function submitCount(){const D=itemsAt(loc).filter(due);const miss=D.filter(i=>counts[loc][i.id]===undefined);
  const mustMiss=miss.filter(i=>i.must);
  if(mustMiss.length)return sheet('必點品項還沒點',`<div class="alert a-bad">${mustMiss.map(i=>'<b>'+esc(fullName(i))+'</b>').join('、')} 是必點，要填數字才能送出（沒有就填 0）。</div><button class="btn pri" type="button" data-close>回去點</button>`,
    ()=>{document.querySelectorAll('#cList .ci').forEach(r=>{if(mustMiss.some(i=>i.id==r.dataset.id))r.querySelector('[data-q]').classList.add('miss')})});
  if(miss.length)return sheet('還有品項沒點',`<div class="alert a-warn">還有 ${miss.length} 項沒填：${miss.map(i=>esc(fullName(i))).join('、')}</div><p class="hint">沒填的品項這次不算，帳面維持原數字。</p><div class="row2"><button class="btn plain" type="button" data-close>回去點</button><button class="btn pri" type="button" id="goSub">先送出</button></div>`,
    ()=>{$('goSub').onclick=()=>{closeSheet();doSubmit()}});

function doSubmit(){const t=`${pad(now.getHours())}:${pad(now.getMinutes())}`;submitted[loc]={by:user(),time:t,data:{...counts[loc]}};

    (diff.length?diff.map(r=>`<tr><td>${esc(fullName(r.i))}</td><td class="r">${r.b} ${r.i.u}</td><td class="r">${r.c} ${r.i.u}</td><td class="r ${r.d>0?'diff-p':'diff-n'}">${r.d>0?'+':''}${r.d}</td></tr>`).join(''):'<tr><td colspan="4">全部相符</td></tr>');
  const z=rows.filter(r=>r.c===0);$('cdZero').innerHTML=z.length?`<b style="color:var(--bad)">無庫存 ${z.length} 項</b><p class="hint" style="margin-top:4px">${z.map(r=>esc(fullName(r.i))).join('、')}</p>`:'<b>沒有無庫存的品項</b>';
  const other=loc==='倉'?'市':'倉';$('cdZero').innerHTML+=submitted[other]?'':`<p class="hint" style="margin-top:8px">${other==='倉'?'倉庫':'市場'}還沒點。</p>`;

/* ---------- 進貨 ---------- */
// 現有庫存：今天有點就用點貨數，沒點就不給建議
function stockOf(i){if(!submitted.倉&&!submitted.市)return null;let s=0;i.locs.forEach(l=>{const c=submitted[l]?.data[i.id];s+=c!==undefined?c:(i.book[l]||0)});return fmt(s)}

  const l=poLine(id);if(l)l.q=v;else if(v>0)curPO.lines.push({id,q:v,sug:sugOf(i)});renderPO()});
$('poItems').addEventListener('click',e=>{const row=e.target.closest('.bi');if(!row||!row.dataset.id)return;const id=+row.dataset.id;const i=IT.find(x=>x.id===id);
  if(e.target.closest('[data-sug]')){const g=sugOf(i);const l=poLine(id);if(l)l.q=g;else curPO.lines.push({id,q:g,sug:g});renderPO();return}
  if(e.target.closest('[data-alt]')){const opts=IT.filter(x=>x.cat===i.cat&&x.id!==id);
    sheet('替代品項：'+fullName(i),`<p class="hint">${esc(fullName(i))} 缺貨時改叫：</p><div class="list">${opts.map(o=>`<button type="button" data-o="${o.id}"><span>${esc(fullName(o))}</span><span class="hint">${o.v||''}</span></button>`).join('')}</div><input id="altFree" placeholder="或自己輸入替代品名"><div class="row2"><button class="btn plain" type="button" data-close>取消</button><button class="btn pri" type="button" id="altOk">確定</button></div>`,
      ()=>{let pick='';$('shB').querySelector('.list').onclick=ev=>{const b=ev.target.closest('[data-o]');if(!b)return;pick=fullName(IT.find(x=>x.id==b.dataset.o));$('altFree').value=pick};
        $('altOk').onclick=()=>{const s=$('altFree').value.trim();if(!s)return;let l=poLine(id);if(!l){l={id,q:sugOf(i)||1};curPO.lines.push(l)}l.sub=s;closeSheet();renderPO();toast('已記下替代品項：'+s)}})}});
$('useSug').addEventListener('click',()=>{let n=0;IT.filter(i=>i.v===vtab).forEach(i=>{const g=sugOf(i);if(g===null)return;const l=poLine(i.id);if(l)l.q=g;else if(g)curPO.lines.push({id:i.id,q:g,sug:g});n++});
  renderPO();toast(n?`${vtab} 已帶入建議量`:'今天還沒點貨，沒有建議量')});
$('addItem').addEventListener('click',()=>sheet('臨時加品項',`<input id="aiQ" type="search" placeholder="搜尋品項"><div class="list" id="aiList"></div>
  <details><summary class="hint">清單沒有？自己輸入</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><input id="aiN" placeholder="品名"><div class="row2"><input id="aiQty" inputmode="decimal" placeholder="數量"><input id="aiU" placeholder="單位" value="件"></div><select id="aiV">${VENDORS.map(v=>`<option${v===vtab?' selected':''}>${v}</option>`).join('')}<option>其他</option></select><button class="btn pri" type="button" id="aiAdd">加入</button></div></details>`,
  ()=>{const draw=()=>{const q=$('aiQ').value.trim();$('aiList').innerHTML=IT.filter(i=>i.v&&(!q||i.n.includes(q))).map(i=>`<button type="button" data-i="${i.id}"><span>${esc(fullName(i))}</span><span class="hint">${i.v}</span></button>`).join('')};draw();
    $('aiQ').oninput=draw;$('aiList').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=IT.find(x=>x.id==b.dataset.i);vtab=i.v;if(!poLine(i.id))curPO.lines.push({id:i.id,q:1});closeSheet();renderPO();toast('已加入 '+fullName(i)+'，請填數量')};
    $('aiAdd').onclick=()=>{const n=$('aiN').value.trim(),q=parseFloat($('aiQty').value);if(!n||!(q>0))return;curPO.lines.push({id:'x'+Date.now(),name:n,q,u:$('aiU').value||'件',v:$('aiV').value});vtab=$('aiV').value;closeSheet();renderPO();toast('已加入 '+n)}}));
function savePO(){toast('已暫存（新增）');go('buy')}
function lineText(v){const L=curPO.lines.filter(l=>vOf(l)===v&&l.q>0);return `【採鮮進貨】${curPO.date}\n`+L.map(l=>{const i=IT.find(x=>x.id===l.id);return i?`${fullName(i)}　${l.q} ${i.u}${l.sub?`（缺貨可換：${l.sub}）`:''}`:`${l.name}　${l.q} ${l.u}`}).join('\n')+'\n謝謝！'}
function showLineText(){const vs=[...new Set(curPO.lines.filter(l=>l.q>0).map(vOf))];
  sheet('給廠商的 LINE 文字',vs.map((v,k)=>`<div><b>${v}</b><pre id="lt${k}">${esc(lineText(v))}</pre><button class="btn soft sm" type="button" data-copy="${k}" style="margin-top:6px">複製 ${v}</button></div>`).join('')+'<button class="btn plain" type="button" data-close>關閉</button>',
  ()=>{$('shB').onclick=async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const t=$('lt'+b.dataset.copy).textContent;
    try{await navigator.clipboard.writeText(t);b.textContent='已複製 ✓'}catch(err){const r=document.createRange();r.selectNodeContents($('lt'+b.dataset.copy));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='已選取，請長按複製'}}})}
function sendPO(){curPO.lines=curPO.lines.filter(l=>l.q>0);curPO.lines.forEach(l=>{const i=IT.find(x=>x.id===l.id);if(i&&i.price!==undefined&&l.price===undefined)l.price=i.price});curPO.st='buy';curPO.recv=false;curPO.slip=curPO.slip||{};
  renderPO();showLineText();toast('已送出進貨單，到貨後請核對數量和金額')}

/* ---------- 到貨核對 ---------- */
let rtab='';
function renderRecv(){const vs=[...new Set(curPO.lines.map(vOf))];if(!vs.includes(rtab))rtab=vs[0];
  $('rTabs').innerHTML=vs.map(v=>{const L=curPO.lines.filter(l=>vOf(l)===v);const ok=L.every(l=>l.got!==undefined);return `<button class="vt" type="button" data-v="${v}" aria-pressed="${v===rtab}">${v}<small>${ok?'已核對':'待核對'}</small></button>`}).join('');
  const L=curPO.lines.filter(l=>vOf(l)===rtab);const ro=curPO.st==='signed';
  $('rItems').innerHTML=L.map((l,k)=>{const i=IT.find(x=>x.id===l.id);const nm=i?fullName(i):l.name,u=i?i.u:l.u;const got=l.got;const short=got!==undefined&&got<l.q;
    return `<div class="bi${got!==undefined?' on':''}" data-k="${curPO.lines.indexOf(l)}"><div class="nm">${esc(nm)}<br><span class="hint">叫 ${l.q} ${esc(u)}${l.sub?'・可換 '+esc(l.sub):''}</span></div>
      <div class="qty"><input inputmode="${u==='公斤'?'decimal':'numeric'}" data-g value="${got??''}" placeholder="${l.q}" ${ro?'disabled':''} aria-label="${esc(nm)}實收"><span class="u">${esc(u)}</span></div>
      <div class="sub" style="grid-column:1/-1;justify-content:space-between">${ro?'<span></span>':`<button class="linkb" type="button" data-same>實收＝${l.q}</button>`}
        <span style="display:flex;align-items:center;gap:6px">單價 <input inputmode="decimal" data-p value="${l.price??''}" placeholder="—" style="width:84px;text-align:right;padding:4px 6px" ${ro?'disabled':''} aria-label="${esc(nm)}單價">／${esc(u)}</span></div>
      ${l.got!==undefined&&l.price!==undefined?`<div class="sub" style="grid-column:1/-1;justify-content:flex-end;color:var(--muted)">小計 <b style="color:var(--fg);font-size:15px">${money(l.got*l.price)}</b></div>`:''}
      ${short?`<div class="sub" style="grid-column:1/-1"><span style="color:var(--bad);font-weight:700">短收 ${fmt(l.q-got)} ${esc(u)}</span><select data-why style="width:auto" ${ro?'disabled':''}><option value="">選原因</option>${SHORT.map(s=>`<option${l.why===s?' selected':''}>${s}</option>`).join('')}</select></div>`:''}</div>`}).join('');
  const VL=curPO.lines.filter(l=>vOf(l)===rtab);const vsum=VL.reduce((a,l)=>a+(l.got!==undefined&&l.price!==undefined?l.got*l.price:0),0);const slip=curPO.slip[rtab];
  $('rSteps').innerHTML=stepsHTML(curPO);
  $('rVendor').innerHTML=`<b>${rtab} 金額核對</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;align-items:end">
    <div><div class="hint">系統計算（實收×單價）</div><b style="font-size:20px">${money(vsum)}</b></div>
    <label class="hint">廠商單據金額<input inputmode="numeric" id="slipAmt" value="${slip??''}" placeholder="照單據填" ${ro?'disabled':''}></label></div>
    ${slip!==undefined&&Math.round(slip)!==Math.round(vsum)?`<div class="alert a-bad" style="margin-top:8px">差 ${money(Math.abs(slip-vsum))}，請檢查數量或單價</div>`:slip!==undefined?'<div class="alert a-ok" style="margin-top:8px">金額相符</div>':''}`;
  const all=curPO.lines.every(l=>l.got!==undefined&&l.price!==undefined);const needWhy=curPO.lines.filter(l=>l.got<l.q&&!l.why).length;
  const noP=curPO.lines.filter(l=>l.got!==undefined&&l.price===undefined).length;
  $('bottom').hidden=false;$('bSum').innerHTML=`已核對 <b>${curPO.lines.filter(l=>l.got!==undefined&&l.price!==undefined).length}</b> / ${curPO.lines.length}${needWhy?`<br><span style="color:var(--bad)">${needWhy} 項短收沒選原因</span>`:''}${noP?`<br><span style="color:var(--bad)">${noP} 項沒填單價</span>`:''}`;
  $('bBtns').innerHTML=ro?'<span class="pill p-done">已簽核</span>':curPO.recv?(can('sign')?`<button class="btn ok" type="button" id="poSign">簽核</button>`:'<span class="hint">等永順或土豆簽核</span>'):`<button class="btn pri" type="button" id="rDone" ${all&&!needWhy?'':'disabled'}>完成核對</button>`}
$('rTabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;rtab=b.dataset.v;renderRecv()});
$('rItems').addEventListener('click',e=>{const row=e.target.closest('.bi');if(!row||!e.target.closest('[data-same]'))return;const l=curPO.lines[+row.dataset.k];l.got=l.q;delete l.why;renderRecv()});
$('rItems').addEventListener('change',e=>{const row=e.target.closest('.bi');if(!row)return;const l=curPO.lines[+row.dataset.k];
  if(e.target.matches('[data-g]')){const v=parseFloat(e.target.value);l.got=isNaN(v)||v<0?undefined:fmt(v);if(l.got>=l.q)delete l.why}
  if(e.target.matches('[data-why]'))l.why=e.target.value;
  if(e.target.matches('[data-p]')){const v=parseFloat(e.target.value);l.price=isNaN(v)||v<0?undefined:v}
  renderRecv()});
$('rVendor').addEventListener('change',e=>{if(e.target.id!=='slipAmt')return;const v=parseFloat(e.target.value);if(isNaN(v))delete curPO.slip[rtab];else curPO.slip[rtab]=v;renderRecv()});
$('rPhoto').addEventListener('change',e=>{[...e.target.files].forEach(f=>photosR.push(URL.createObjectURL(f)));$('rPhotos').innerHTML=photosR.map(u=>`<img src="${u}" alt="廠商單據">`).join('')});
function finishRecv(){const mis=Object.entries(curPO.slip).filter(([v,a])=>Math.round(a)!==Math.round(curPO.lines.filter(l=>vOf(l)===v).reduce((x,l)=>x+l.got*l.price,0)));
  if(mis.length&&!finishRecv.ok){sheet('金額不符',`<div class="alert a-bad">${mis.map(m=>m[0]).join('、')} 的廠商單據金額跟系統計算不同。</div><div class="row2"><button class="btn plain" type="button" data-close>回去檢查</button><button class="btn pri" type="button" id="fOk">仍完成核對</button></div>`,()=>{$('fOk').onclick=()=>{finishRecv.ok=1;closeSheet();finishRecv();finishRecv.ok=0}});return}
  curPO.recv=true;renderRecv();toast('到貨核對完成'+(can('sign')?'，可以簽核':'，等永順或土豆簽核'))}
function signPO(){const sh=curPO.lines.filter(l=>l.got<l.q);
  sheet('簽核進貨單',`<p style="margin:0">${curPO.no}・${curPO.lines.length} 項</p>${sh.length?`<div class="alert a-warn">短收 ${sh.length} 項：${sh.map(l=>{const i=IT.find(x=>x.id===l.id);return esc(i?fullName(i):l.name)+'（'+l.why+'）'}).join('、')}</div>`:'<div class="alert a-ok">全部照叫的量到貨</div>'}
    <div class="alert a-info">進貨總金額 <b>${money(curPO.lines.reduce((a,l)=>a+l.got*(l.price||0),0))}</b>${Object.keys(curPO.slip).length?'・廠商單據 '+money(Object.values(curPO.slip).reduce((a,b)=>a+b,0)):''}</div>
    <p class="hint">確認正確後簽核：實收量正式進倉庫庫存，單價寫進成本價格。簽核後不能直接修改，要先簽退。</p><div class="row2"><button class="btn plain" type="button" data-close>取消</button><button class="btn ok" type="button" id="sOk">確定簽核</button></div>`,
    ()=>{$('sOk').onclick=()=>{curPO.st='signed';curPO.signBy=user();closeSheet();toast('已簽核（'+user()+'）');go('buy')}})}

go('home');
</script>
</body>
</html>
