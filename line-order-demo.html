<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>採鮮下單頁樣品</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: 照農易訂客戶端 — 頂部綠色標題列（左選單、中店名、右搜尋購物車）、內容、底部 商品／訂單／通知／個人 */
:root{
  --bg:#f6f3ec; --card:#fffdf9; --fg:#1f3a30; --muted:#6c766d; --line:#e4ddcf;
  --head:#13453b; --head-fg:#ffffff; --head-btn:#1d5a4c; --head-btn-fg:#ffffff; --name:#1b4a3c;
  --accent:#4e7a34; --accent-soft:#e7eedd; --on-accent:#ffffff; --gold-btn:#e3b030; --on-gold:#1f2a12;
  --fav-off:#ffffff; --orange:#b07d12; --orange-soft:#faf1d9; --on-orange:#1f2a12; --heart:#d24b45;
  --bad:#c23b32; --bad-soft:#fbe6e4; --info:#2c5e89; --info-soft:#e3edf7; --unread:#fbf5e6;
  --f-display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1b231e; --fg:#e8ece6; --muted:#a2ada4; --line:#2c3630;
  --head:#0e3a31; --head-fg:#ffffff; --head-btn:#1a5245; --head-btn-fg:#ffffff; --name:#cfe6d6;
  --accent:#9ccc7a; --accent-soft:#24331f; --on-accent:#102010; --gold-btn:#e3b030; --on-gold:#1f2a12;
  --fav-off:#1b231e; --orange:#e3b030; --orange-soft:#3a3015; --on-orange:#1f2a12; --heart:#f08a80;
  --bad:#f08a80; --bad-soft:#3a1c19; --info:#90bbe5; --info-soft:#19293a; --unread:#262117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1b231e; --fg:#e8ece6; --muted:#a2ada4; --line:#2c3630;
  --head:#0e3a31; --head-fg:#ffffff; --head-btn:#1a5245; --head-btn-fg:#ffffff; --name:#cfe6d6;
  --accent:#9ccc7a; --accent-soft:#24331f; --on-accent:#102010; --gold-btn:#e3b030; --on-gold:#1f2a12;
  --fav-off:#1b231e; --orange:#e3b030; --orange-soft:#3a3015; --on-orange:#1f2a12; --heart:#f08a80;
  --bad:#f08a80; --bad-soft:#3a1c19; --info:#90bbe5; --info-soft:#19293a; --unread:#262117; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:640px;margin:0 auto}

.demo{background:var(--info-soft);color:var(--info);font-size:12.5px;padding-block:6px}
.demo .in{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.demo select{width:auto;font-size:12.5px;padding:2px 6px;background:var(--card)}
.demo label{display:flex;gap:4px;align-items:center}
.demo input[type=checkbox]{width:auto}

/* 頂部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--head);color:var(--head-fg)}
.top .bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding-block:10px;min-height:64px}
.brand{font-weight:700;font-size:19px;white-space:nowrap;justify-self:start}
.ctmenu{flex:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--accent);padding:6px 12px 6px 0;display:flex;align-items:center}
.top h1{margin:0;text-align:center;font-weight:700;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top h1 button{border:0;background:transparent;font-weight:700;font-size:20px;color:var(--head-fg)}
.hb{width:44px;height:44px;border-radius:50%;border:0;background:var(--head-btn);color:var(--head-btn-fg);display:inline-flex;align-items:center;justify-content:center;position:relative}
.hpill{display:inline-flex;background:var(--head-btn);border-radius:999px;justify-self:end}
.hpill .hb{background:transparent}
.right{justify-self:end}
.cnt{position:absolute;top:2px;right:2px;background:var(--orange);color:var(--on-orange);font-size:11px;border-radius:999px;padding:0 5px;line-height:16px;font-weight:700}
.cnt:empty{display:none}
.searchrow{padding-block:0 10px}
.searchrow input{background:var(--card)}

/* 商品頁 */
.cats{display:flex;align-items:center;background:var(--card);border-bottom:1px solid var(--line)}
.cats .scroll{display:flex;gap:4px;overflow-x:auto;flex:1}
.ct{flex:none;border:0;background:transparent;color:var(--fg);padding:4px 10px;margin-block:8px;font-size:16px;border-radius:6px}
.ct[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.ctfav{flex:none;border:0;border-left:1px solid var(--line);background:transparent;color:var(--name);padding:6px 14px;font-size:22px}
.ctfav[aria-pressed="true"]{background:var(--orange-soft)}
.subs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
main{padding-block:12px 170px;display:flex;flex-direction:column;gap:10px}
.inforow{display:grid;grid-template-columns:1fr auto;gap:10px}
.notice-btn,.date-btn{border:0;border-radius:8px;display:flex;align-items:center;gap:8px;padding:10px 12px;min-width:0}
.notice-btn{background:transparent;color:var(--name);padding-left:0}
.date-btn{background:var(--gold-btn);color:var(--on-gold);font-weight:700}
.notice-btn .mq{flex:1;overflow:hidden;white-space:nowrap;font-weight:700;font-size:14px;text-align:left}
.notice-btn .mq span{display:inline-block;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.notice-btn .mq span{animation:none;padding-left:0}}
.date-btn{font-size:17px;font-variant-numeric:tabular-nums}
.warnbar{border-radius:8px;padding:8px 12px;font-size:13.5px;background:var(--orange-soft);color:var(--orange)}
.warnbar.bad{background:var(--bad-soft);color:var(--bad)}
.pc{display:grid;grid-template-columns:1fr;background:var(--card);border-radius:10px;box-shadow:0 1px 3px rgba(60,40,10,.08);padding:12px 14px;align-items:center}
.pc.on{outline:2px solid var(--accent)}
.thumb{width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .ph{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle,#efe2c4 0 55%,#d9c08f 56% 62%,#efe2c4 63%);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;color:#7a6440}
.pc .info{display:flex;flex-direction:column;gap:6px;min-width:0}
.pc .top1{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:12px;row-gap:0;min-width:0}
.pc .top1 .nm{min-width:0;white-space:normal;font-weight:700;color:var(--name)}
.pc .top1 .pr{flex:none}
.pc .top2{display:flex;align-items:flex-end;gap:8px}
.pc .notes{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--muted);line-height:1.4}
.pc .notes .warnnote{color:var(--orange)}
.pc .btns{display:flex;gap:6px;flex:none}
.pc .nm{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .row{display:flex;align-items:center;gap:8px}
.pc .pr{font-size:19px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc .pr small{font-size:13px;font-weight:400;color:var(--muted)}
.pc .meta{font-size:12.5px;color:var(--muted)}
.tag{font-size:11.5px;border-radius:999px;padding:0 7px;background:var(--orange-soft);color:var(--orange);margin-left:4px}
.ib{width:50px;height:34px;border:0;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;position:relative}
.ib.fav{background:var(--fav-off);color:var(--name);border:1.5px solid var(--line)}
.ib.fav[aria-pressed="true"]{background:var(--bad-soft);color:var(--heart);border-color:var(--heart)}
.ib.fav[aria-pressed="true"] svg{fill:currentColor}
.ib.cart{background:var(--accent);color:var(--on-accent)}
.ib .q{position:absolute;top:-7px;right:-7px;background:var(--accent);color:var(--on-accent);font-size:11px;border-radius:999px;padding:0 5px;line-height:17px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--card);border:1px dashed var(--line);border-radius:8px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;text-decoration:underline;padding:8px}

.btn{border:0;border-radius:8px;padding:11px 14px;font-weight:700;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.or{background:var(--gold-btn);color:var(--on-gold)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.grey{background:#5f5f5f;color:#fff}
.btn.plain{background:var(--card);border:1px solid var(--line)}
.btn.outline{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:5px 14px;font-size:15px}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding-block:8px;pointer-events:none}
.cartbar .in{display:flex;align-items:center;gap:10px;background:var(--head);color:var(--head-fg);border-radius:12px;padding:8px 8px 8px 16px;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:auto}
.cartbar .sum{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
.cartbar .sum b{font-size:18px}
.cartbar .sum b#cbAmt{color:var(--gold-btn)}
.cartbar .btn{background:var(--gold-btn);color:var(--on-gold);font-size:17px;padding:11px 22px}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabbar button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav.tabbar button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:2px;left:calc(50% + 4px);background:var(--bad);color:#fff;font-style:normal;font-size:11.5px;border-radius:999px;padding:0 6px;line-height:19px;font-weight:700}
.badge:empty{display:none}

/* 訂單 */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card)}
.seg button{border:0;background:transparent;padding:12px 0;border-bottom:3px solid transparent;font-size:16px;text-decoration:underline;text-underline-offset:4px;color:var(--fg)}
.seg button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.flat{padding-block:0 170px;gap:10px;display:flex;flex-direction:column}
.oc{background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.oc .h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.oc .sup{font-size:19px;font-weight:700}
.oc .items{font-size:17px}
.oc .store{font-size:16px;color:var(--muted)}
.oc .f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.oc .d{color:var(--head);font-size:16px;font-variant-numeric:tabular-nums}
.oc .amt{color:var(--orange);font-size:17px;font-variant-numeric:tabular-nums}
.oc .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;font-weight:700;background:var(--bad-soft);color:var(--bad)}

/* 通知 */
.nt{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;width:100%}
.nt.unread{background:var(--unread)}
.nt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nt b{font-size:18px}
.nt span{font-size:15.5px;color:var(--muted)}
.nt time{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nt .dot{width:11px;height:11px;border-radius:50%;background:var(--orange);flex:none;margin-top:8px}
.nt:not(.unread) .dot{visibility:hidden}

/* 個人 */
.phead{background:var(--head);color:var(--head-fg);border-radius:0 0 40px 40px;padding-block:10px 64px}
.phead .in{display:flex;align-items:center;gap:12px}
.phead .av{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;flex:none}
.phead b{font-size:24px;flex:1}
.phead .set{border:0;background:rgba(0,0,0,.18);color:#fff;border-radius:999px;padding:6px 16px;font-size:17px}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:-52px;position:relative}
.sc{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.sc .ic{width:62px;height:62px;border-radius:50%;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.menu{background:var(--card);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;padding:15px 16px;text-align:left;font-size:18px}
.menu .mi:first-child{border-top:0}
.menu .mi span{flex:1}
.menu .mi svg{color:var(--muted)}
.ver{text-align:center;color:var(--muted);font-size:14px}

/* 彈出 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.specs{display:flex;gap:8px;flex-wrap:wrap}
.sp{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;font-size:15px}
.sp[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.pimg{display:block;margin:0 auto;width:100%;max-width:260px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);width:max-content}
.step button{width:44px;height:44px;border:0;background:transparent;color:var(--accent);font-size:22px}
.step input{width:70px;border:0;border-radius:0;text-align:center;padding:6px 0;background:transparent;font-variant-numeric:tabular-nums;font-size:18px}
.step.sm button{width:32px;height:32px;font-size:18px}
.step.sm input{width:48px;font-size:15px}
.big-pr{font-size:24px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0}
.cl .nm{font-weight:700}
.cl .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--orange-soft);border-radius:8px;padding:12px 14px}
.total b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--orange)}
.datebar{display:flex;gap:10px;align-items:center}
.datebar b{flex:none;font-weight:500;color:var(--muted);font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:4px 0}
.tbl td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl .r{text-align:right}
.tblwrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.field>span{font-size:17px}
.field .two{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.radio{display:flex;flex-direction:column}
.radio label{display:flex;gap:10px;align-items:center;padding:8px 2px;font-size:17px}
.radio input{width:20px;height:20px;accent-color:var(--orange)}
.ok{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 0}
.ok .big{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:34px}
.ok b{font-size:19px;font-variant-numeric:tabular-nums}
.catlist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 4px;font-size:17px}
.catlist button.sub{padding-left:24px;font-size:15px;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--accent-soft);border-radius:6px;font-size:13px;color:var(--muted)}
.stat b{display:block;color:var(--fg);font-size:16px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90%}
</style>
</head>
<body>

<div class="demo gut"><div class="in">
  <b>樣品資料</b>
  <label>模擬時間 <select id="simTime"><option value="now">現在</option><option value="00:30">00:30 截單前</option><option value="02:00">02:00 灰色時段</option><option value="05:00">05:00 已換日</option></select></label>
  <label>異常倍數 <select id="mult"><option>1.5</option><option selected>2</option><option>3</option></select> 倍（後台設定）</label>
  <label><input type="checkbox" id="showPay" checked> 出貨明細顯示收款狀態（後台設定）</label>
</div></div>

<header class="top"><div class="gut"><div class="in">
  <div class="bar">
    <div id="hLeft"></div>
    <h1 id="hTitle"></h1>
    <div id="hRight" class="right"></div>
  </div>
  <div class="searchrow" id="searchRow" hidden><input type="search" id="q" placeholder="搜尋商品…"></div>
</div></div></header>

<!-- 商品 -->
<section id="v-shop">

/* 數量防呆：公斤小數 1 位、其他整數、倍數、最小量 */
function norm(sp,q){const msg=[];if(!(q>0))return{v:0,msg};let v=isKg(sp)?Math.round(q*10)/10:Math.round(q);
  if(v!==q)msg.push(isKg(sp)?'公斤最多到小數 1 位':sp.u+'只能是整數');
  if(sp.mult&&v%sp.mult){v=Math.ceil(v/sp.mult)*sp.mult;msg.push(`以 ${sp.mult} ${sp.u}為單位`)}
  if(sp.min&&v<sp.min){v=sp.min;msg.push(`最少訂 ${sp.min} ${sp.u}`)}
  if(v<=0){v=isKg(sp)?0.1:1}
  return{v,msg}}

  let h='';if(v===REST)h=`<div class="warnbar bad">${md(v)}${wk(v)} 採鮮公休，請改選其他日期。</div>`;
  else if(inGrey(v))h=`<div class="warnbar">已過凌晨 01:00 截單，${md(v)} 交貨需採鮮確認，送出時可選擇順延。</div>`;
  $('dateWarn').innerHTML=h;$('dateWarn').hidden=!h;renderProducts()}
function dateSheet(after){sheet('選擇交貨日',`<input type="date" id="dIn" min="${earliest()}" value="${date}"><p class="hint">截單：交貨日當天凌晨 01:00。01:00～04:00 下單會詢問是否順延；04:00 後最早隔天交貨。</p><div class="row2"><button class="btn plain" type="button" data-close>取消</button><button class="btn pri" type="button" id="dOk">確定</button></div>`,

const qtyOf=pid=>Object.entries(cart).filter(([k])=>k.split('_')[0]==pid).reduce((a,[,v])=>a+v,0);
function cardNotes(p){const N=[];
  if(p.sp.length>1)N.push('規格：'+p.sp.map(s=>s.u).join('／'));else N.push('規格：'+p.sp[0].u);
  p.sp.forEach(s=>{const pre=p.sp.length>1?s.u+' ':'';if(s.mult)N.push(`${pre}以 ${s.mult} ${s.u}為單位`);else if(s.min)N.push(`${pre}最少 ${s.min} ${s.u}`);if(byWeight(s))N.push(`論${s.u}訂，依重量計價`)});
  if(p.lead)N.push(`需提前 ${p.lead} 天訂`);return N}
function renderProducts(){const q=$('q').value.trim();
  const v=P.filter(p=>q?p.n.includes(q):favOnly?fav.has(p.id):(cat==='全部'||p.c===cat)&&(!sub||p.s===sub));
  $('ptime').textContent=`${v.length} 項商品・價格更新 ${md(TODAY())} 14:30・${md(date)} 交貨價`;
  $('plist').innerHTML=v.length?v.map(p=>{const q=qtyOf(p.id);const sp=p.sp[cardSi(p)];const N=cardNotes(p);return `<div class="pc${q?' on':''}" data-p="${p.id}">
    <div class="info">
      <div class="top1"><span class="nm">${p.n}</span><span class="pr">${p.mk?'時價':money(sp.pr)+'<small>/'+(sp.pu||sp.u)+'</small>'}</span></div>
      <div class="top2"><div class="notes">${N.map((n,i)=>`<span class="${i&&!n.startsWith('規格')?'warnnote':''}">${n}</span>`).join('')}</div>
        <div class="btns"><button class="ib fav" type="button" data-fav aria-pressed="${fav.has(p.id)}" aria-label="常用">${SVG.heart}</button>
        <button class="ib cart" type="button" data-add aria-label="加入購物車">${SVG.cart}${q?`<i class="q">${p.sp.filter((_,i)=>cart[p.id+'_'+i]).length}</i>`:''}</button></div></div>
    </div></div>`}).join('')
    :`<div class="empty">${favOnly?'還沒有常用商品，點商品的 ♥ 加入':'找不到商品，可用下方「加入客訂」'}</div>`;
  renderCartBar()}
$('plist').addEventListener('click',e=>{const c=e.target.closest('.pc');if(!c)return;const pid=+c.dataset.p;
  if(e.target.closest('[data-fav]')){fav.has(pid)?fav.delete(pid):fav.add(pid);toast(fav.has(pid)?'已加入常用':'已移出常用');renderProducts();return}
  openProduct(pid)});
function openProduct(pid){const p=P.find(x=>x.id===pid);const inCart=p.sp.findIndex((_,i)=>cart[pid+'_'+i]);
  const usual=Object.keys(HIST[store]).find(k=>k.split('_')[0]==pid);
  let si=inCart>=0?inCart:usual?+usual.split('_')[1]:cardSi(p);
  const draw=(msg)=>{const sp=p.sp[si];const k=pid+'_'+si;const avg=HIST[store][k];
    $('shB').innerHTML=`${IMG[pid]?`<img class="pimg" src="${IMG[pid]}" alt="${p.n}">`:''}${p.lead?`<div class="warnbar">此商品需提前 ${p.lead} 天訂購</div>`:''}
    <div><div class="hint" style="margin-bottom:6px">規格</div><div class="specs">${p.sp.map((s,i)=>`<button class="sp" type="button" data-si="${i}" aria-pressed="${i===si}">${s.u}${cart[pid+'_'+i]?'・'+cart[pid+'_'+i]:''}</button>`).join('')}</div></div>
    <div class="big-pr">${priceTxt(p,sp)}</div>
    <div style="display:flex;align-items:center;gap:12px"><div class="step"><button type="button" data-d="-1" aria-label="減少">−</button><input id="pq" inputmode="${isKg(sp)?'decimal':'numeric'}" value="${cart[k]||sp.min||sp.mult||1}" aria-label="數量"><button type="button" data-d="1" aria-label="增加">+</button></div><span style="font-size:18px">${sp.u}</span></div>
    <p class="hint">${[isKg(sp)?'可填到小數 1 位（例 2.5）':'只能填整數',sp.mult?`以 ${sp.mult} ${sp.u}為單位`:'',sp.min?`最少 ${sp.min} ${sp.u}`:'',avg?`這家店近 2 週平均 ${avg} ${sp.u}`:''].filter(Boolean).join('・')}</p>
    ${msg&&msg.length?`<div class="warnbar">${msg.join('，')}，已自動調整，請確認數量</div>`:''}
    <input id="pnote" placeholder="單品備註（例：要小顆）" value="${esc(lineNotes[k]||'')}">
    <div class="row2">${cart[k]?`<button class="btn plain" type="button" id="pDel">移出購物車</button>`:`<button class="btn plain" type="button" data-close>取消</button>`}<button class="btn or" type="button" id="pAdd">${cart[k]?'更新數量':'加入購物車'}</button></div>`};
  sheet(p.n,'',()=>{draw();$('shB').onclick=e=>{const sp=p.sp[si];
    const s=e.target.closest('[data-si]');if(s){si=+s.dataset.si;draw();return}
    const d=e.target.closest('[data-d]');if(d){const step=sp.mult||1;let v=(parseFloat($('pq').value)||0)+(+d.dataset.d)*step;v=Math.max(sp.min||0,Math.round(v*10)/10);$('pq').value=v||'';return}
    const k=pid+'_'+si;
    if(e.target.closest('#pAdd')){const raw=parseFloat($('pq').value);
      if(!(raw>0)){delete cart[k];closeSheet();renderProducts();header();$('shB').onclick=null;return}
      const r=norm(sp,raw);if(r.msg.length&&r.v!==raw){$('pq').value=r.v;draw(r.msg);$('pq').value=r.v;return}
      cart[k]=r.v;lineNotes[k]=$('pnote').value;closeSheet();renderProducts();header();toast(`${p.n} ${r.v} ${sp.u} 已加入`);$('shB').onclick=null}
    if(e.target.closest('#pDel')){delete cart[k];closeSheet();renderProducts();header();$('shB').onclick=null}}})}

function lines(){const L=[];Object.entries(cart).forEach(([k,q])=>{const[pid,si]=k.split('_').map(Number);const p=P.find(x=>x.id===pid);const sp=p.sp[si];L.push({k,p,si,sp,q,u:sp.u,pr:p.mk||byWeight(sp)?null:sp.pr,tag:p.mk?'時價':byWeight(sp)?money(sp.pr)+'/'+sp.pu+'，依重量計價':''})});custom.forEach((c,i)=>L.push({k:'c'+i,custom:c.n,u:c.u,q:c.q,pr:null}));return L}
function est(){const L=lines();return{n:L.length,amt:L.reduce((a,l)=>a+(l.pr?l.pr*l.q:0),0),mk:L.filter(l=>l.pr===null).length}}
function renderCartBar(){const e=est();$('cartbar').hidden=!e.n||view!=='shop';$('cbN').textContent=e.n;$('cbAmt').textContent=money(e.amt);$('cbMk').textContent=e.mk?`另有 ${e.mk} 項時價／依重量／客訂，以出貨為準`:''}
$('openCart2').addEventListener('click',()=>openCart());
function openCart(){const draw=()=>{const L=lines(),e=est();
  $('shB').innerHTML=`${editing?`<div class="warnbar">正在修改訂單 ${editing}，送出後更新原訂單</div>`:''}
  <div class="datebar"><b>交貨日</b><button class="btn plain" type="button" id="cDate" style="flex:1">${full(date)}${wk(date)}</button></div>${$('dateWarn').innerHTML}
  <div>${L.length?L.map(l=>`<div class="cl" data-k="${l.k}"><div><div class="nm">${esc(l.custom?l.custom+'（客訂）':l.p.n)}</div><div class="sub">${l.custom?'價格以出貨明細為準':l.pr===null?l.tag:money(l.pr)+' / '+l.u+'　小計 '+money(l.pr*l.q)}${lineNotes[l.k]?'<br>備註：'+esc(lineNotes[l.k]):''}</div></div>
    <div style="display:flex;gap:6px;align-items:center"><div class="step sm"><button type="button" data-d="-1" aria-label="減少">−</button><input inputmode="decimal" data-q value="${l.q}" aria-label="數量"><button type="button" data-d="1" aria-label="增加">+</button></div><span class="hint">${esc(l.u)}</span></div></div>`).join(''):'<div class="empty">購物車是空的</div>'}</div>
  <label class="hint">訂單備註（會印在分裝明細表）<textarea id="cNote" rows="2" placeholder="例：早上 7 點前送到後門">${esc(cartNote)}</textarea></label>
  <div class="total"><span>預估金額${e.mk?`<br><small class="hint">另有 ${e.mk} 項時價／依重量／客訂未計入</small>`:''}</span><b>${money(e.amt)}</b></div>

    const usual=Object.keys(HIST[store]).filter(k=>k.split('_')[0]==l.p.id).map(k=>+k.split('_')[1]);
    if(usual.length&&!usual.includes(l.si))W.push(`<b>${l.p.n}</b>：近 2 週都用「${usual.map(i=>l.p.sp[i].u).join('、')}」訂，這次是 <b>${l.q} ${l.u}</b>，單位沒選錯嗎？`)});

 faq:['常見問題',`<p><b>怎麼知道下單成功？</b><br>送出後顯示單號，「通知」也會有一則「訂單已提交」。</p><p><b>可以改單嗎？</b><br>截單前在「訂單 → 已提交」按「修改」。</p><p><b>為什麼是時價？</b><br>價格變動大的商品以出貨明細為準。</p><p><b>為什麼找不到某些商品？</b><br>只顯示該交貨日有供應的商品，可用「加入客訂」。</p>`],
 guide:['操作教學',`<p>1. 右上角日曆選交貨日<br>2. 點商品的橘色購物車，選規格、數量（公斤可填小數 1 位，包、盒只能整數）<br>3. 下方綠色列「去結帳」送出<br>4. 「訂單」查進度，「通知」看出貨狀況</p>`],
 notice:['購物須知',`<table class="tbl"><tr><td>下單截止</td><td>交貨日當天凌晨 01:00<br><small class="hint">01:00～04:00 下單會詢問是否順延</small></td></tr><tr><td>配送區域</td><td>沙鹿、梧棲、清水、西屯、太平</td></tr><tr><td>配送時間</td><td>依各路線安排</td></tr><tr><td>公告</td><td>${ANN}</td></tr></table>`],
 contact:['聯絡採鮮',`<p>LINE 官方帳號 @nvy5669n<br>台中市沙鹿區平等路</p>`],
 terms:['使用條款及隱私權政策',`<p class="hint">正式版放條款內容。</p>`],
 apply:['申請綁定新店家',`<label>店名<input placeholder="例：清水麵店"></label><label>送貨地址<input placeholder="例：清水區中山路 1 號"></label><label>聯絡電話<input type="tel" placeholder="09xx-xxx-xxx"></label><p class="hint">送出後由採鮮審核，可在「個人 → 會員進度」查看結果。</p><button class="btn pri" type="button" id="appGo">送出申請</button>`]};
function memberSheet(){sheet('會員進度',`<p class="hint" style="margin:0">店家綁定申請由採鮮審核，核准後才能用該店下單。</p>
  ${apps.map(a=>`<div class="oc" style="border:1px solid var(--line);border-radius:8px"><div class="f"><b style="font-size:17px">${esc(a.n)}</b><span class="pill" style="${APPST[a.st][1]}">${APPST[a.st][0]}</span></div>
  <div class="hint">${esc(a.a)}・申請日 ${full(a.d)}</div>${a.why?`<div class="warnbar bad">未通過原因：${esc(a.why)}</div>`:''}${a.st==='wait'?'<div class="hint">審核結果會在「通知」告訴你</div>':''}${a.st==='no'?'<button class="btn soft sm" type="button" data-sheet="apply" style="align-self:flex-start">修改後重新申請</button>':''}</div>`).join('')}
  <button class="btn or" type="button" data-sheet="apply">＋ 申請綁定新店家</button><button class="btn plain" type="button" data-close>關閉</button>`)}
function info(k){if(k==='stores')return openStores();if(k==='member')return memberSheet();const[t,h]=INFO[k];sheet(t,h+(h.includes('data-close')||h.includes('appGo')?'':'<button class="btn plain" type="button" data-close>關閉</button>'));
  if(k==='apply')$('appGo').onclick=()=>{const n=$('shB').querySelector('input').value.trim();if(!n){$('shB').querySelector('input').focus();return}
    apps.unshift({n,a:$('shB').querySelectorAll('input')[1].value.trim()||'（未填）',d:TODAY(),st:'wait'});updMBadge();memberSheet();toast('已送出申請，等待採鮮審核')}}
$('openNotice').addEventListener('click',()=>info('notice'));
document.addEventListener('click',e=>{const s=e.target.closest('[data-sheet]');if(s){info(s.dataset.sheet);return}const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});

/* ---------- 分頁 ---------- */
function go(v){if(!(v in TITLES))v='shop';view=v;Object.keys(TITLES).forEach(k=>$('v-'+k).hidden=k!==v);
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.dataset.v===(PARENT[v]||v)?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  header();if(v==='orders')renderOrders();if(v==='notes')renderNotes();if(v==='slips')renderSlips();if(v==='price')renderPrice();if(v==='stats')renderStats();renderCartBar();window.scrollTo(0,0)}
document.querySelector('nav.tabbar').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)go(b.dataset.v)});

apps[2].d=addD(TODAY(),-1);renderCats();setDate(earliest());updBadge();updMBadge();go((location.hash||'').slice(1));
</script>
